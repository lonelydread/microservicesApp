spring:
  application:
    name: orderService
  grpc:
    client:
      channel:
        inventory:
          target: ${INVENTORY_GRPC_TARGET:localhost:9090}
          ssl:
            enabled: false

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: order-service
    access-token-ttl: 15m
    refresh-token-ttl: 7d
inventory:
  grpc:
    timeout: ${INVENTORY_GRPC_TIMEOUT:3s}

server:
  port: ${SERVER_PORT:8081}
