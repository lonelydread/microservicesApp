spring:
  application:
    name: orderService
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 15000
  mvc:
    log-request-details: false
    async:
      request-timeout: 30s
  grpc:
    client:
      channel:
        inventory:
          target: ${INVENTORY_GRPC_TARGET:localhost:9090}
          ssl:
            enabled: false

logging:
  level:
    org.springframework.web: INFO

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: order-service
    access-token-ttl: 15m
    refresh-token-ttl: 7d
inventory:
  grpc:
    timeout: ${INVENTORY_GRPC_TIMEOUT:3s}

server:
  port: ${SERVER_PORT:8081}

orders:
  kafka:
    topic: ${ORDER_CREATED_TOPIC:orders.created}
